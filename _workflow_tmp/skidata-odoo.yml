name: SKIDATA-Odoo Parking Pipeline

on:
  schedule:
    # Daily at 03:00 UTC (06:00 AST / Saudi)
    - cron: "0 3 * * *"
  workflow_dispatch:
    # Manual run from GitHub Actions tab
  repository_dispatch:
    # External cron (e.g. cron-job.org) via GitHub API
    types: [manual-trigger]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run Parking Transactions pipeline
        env:
          HEADLESS: "true"
          UPLOAD_TO_SHAREPOINT: "true"
          SKIDATA_URL: ${{ secrets.SKIDATA_URL }}
          SKIDATA_TENANT: ${{ secrets.SKIDATA_TENANT }}
          SKIDATA_LOGIN: ${{ secrets.SKIDATA_LOGIN }}
          SKIDATA_PASSWORD: ${{ secrets.SKIDATA_PASSWORD }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
          TARGET_FOLDER_PATH: ${{ secrets.TARGET_FOLDER_PATH }}
        run: python main.py
