name: SKIDATA-Odoo Parking Pipeline

on:
  workflow_dispatch:
    # Manual run from GitHub Actions tab
    inputs:
      target_date:
        description: "Day to prepare, YYYY-MM-DD. Leave empty for the newest raw file."
        required: false
        default: ""
      source_folder:
        description: "Source SharePoint folder for raw Parking files"
        required: false
        default: "Skidata_Daily_Files"
      target_folder_odoo:
        description: "Destination SharePoint folder for Odoo files (dev branch defaults to Odoo_testing_Sumit)"
        required: false
        default: "Odoo_testing_Sumit"
  repository_dispatch:
    # External cron (e.g. cron-job.org) via GitHub API
    types: [manual-trigger]

concurrency:
  group: skidata-odoo
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Parking Transactions pipeline
        env:
          UPLOAD_TO_SHAREPOINT: "true"
          TARGET_DATE: ${{ inputs.target_date }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
          # Raw daily Parking Transactions source folder (Skidata_Daily_Files)
          TARGET_FOLDER_PATH: ${{ inputs.source_folder || 'Skidata_Daily_Files' }}
          # Transformed *-Odoo.xlsx destination (isolated in Odoo_testing_Sumit on dev)
          TARGET_FOLDER_PATH_ODOO: ${{ inputs.target_folder_odoo || 'Odoo_testing_Sumit' }}
        run: python main.py
