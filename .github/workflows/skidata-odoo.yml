name: SKIDATA-Odoo Parking Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: '5days_rolling' (15/5-day rolling), 'daily', or 'aug_sep_historical'"
        required: false
        default: "5days_rolling"
      target_date:
        description: "Date filter in filename (YYYY-MM-DD or DD-Mon). Leave empty for latest file."
        required: false
        default: ""
      run_tag:
        description: "Run tag filter (Morning, Evening, 12Noon). Leave empty for latest."
        required: false
        default: ""
      source_folder:
        description: "Source SharePoint folder (defaults to 'Ski Data 5')"
        required: false
        default: "Ski Data 5"
      target_folder_odoo:
        description: "Destination folder for transformed Excel (defaults to 'Odoo_testing_Sumit')"
        required: false
        default: "Odoo_testing_Sumit"
      import_to_odoo:
        description: "Import new tickets into Odoo ERP (true/false)"
        required: false
        default: "true"

  repository_dispatch:
    # External cron (cron-job.org) trigger support
    types: [skidata-odoo-pipeline]

concurrency:
  group: skidata-odoo
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref || 'feature/5-days-rolling' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r skidata-odoo-share/requirements.txt

      - name: Run Parking Transactions pipeline (Transform & Archive to SharePoint)
        env:
          UPLOAD_TO_SHAREPOINT: "true"
          TARGET_DATE: ${{ inputs.target_date }}
          RUN_TAG: ${{ inputs.run_tag }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
          SHAREPOINT_SOURCE_FOLDER: ${{ inputs.source_folder || 'Ski Data 5' }}
          TARGET_FOLDER_PATH: ${{ inputs.source_folder || 'Ski Data 5' }}
          TARGET_FOLDER_PATH_ODOO: ${{ inputs.target_folder_odoo || 'Odoo_testing_Sumit' }}
        run: |
          if [ "${{ inputs.mode }}" = "aug_sep_historical" ]; then
            if [ -n "${{ inputs.source_folder }}" ] && [ "${{ inputs.source_folder }}" != "Ski Data 5" ]; then
              python process_aug_sep.py --source-folder "${{ inputs.source_folder }}"
            else
              python process_aug_sep.py
            fi
          else
            python main.py
          fi

      - name: Smart Import to Odoo ERP (Fast Batch Dedupe + Post & Pay New)
        if: ${{ inputs.import_to_odoo != 'false' }}
        working-directory: skidata-odoo-share
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
          TARGET_FOLDER_PATH_ODOO: ${{ inputs.target_folder_odoo || 'Odoo_testing_Sumit' }}
          TARGET_FOLDER_PATH: ${{ inputs.target_folder_odoo || 'Odoo_testing_Sumit' }}
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          ODOO_JOURNAL_ID: ${{ secrets.ODOO_JOURNAL_ID }}
          ODOO_SALES_ACCOUNT_ID: ${{ secrets.ODOO_SALES_ACCOUNT_ID }}
          ODOO_TAX_ID: ${{ secrets.ODOO_TAX_ID }}
          ODOO_WALKIN_PARTNER_ID: ${{ secrets.ODOO_WALKIN_PARTNER_ID }}
          ODOO_PAYMENT_JOURNAL_ID: ${{ secrets.ODOO_PAYMENT_JOURNAL_ID }}
          ODOO_POST: "true"
          ODOO_PAY: "true"
          IMPORT_LIMIT: ${{ secrets.IMPORT_LIMIT }}
          TARGET_DATE: ${{ inputs.target_date }}
          RUN_TAG: ${{ inputs.run_tag }}
        run: python main_import.py
