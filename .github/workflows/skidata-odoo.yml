name: SKIDATA-Odoo Parking Pipeline

on:
  # Disabled: using external cron-job.org instead. Uncomment to re-enable GitHub schedule.
  # schedule:
  #   # Daily at 03:00 UTC (06:00 AST / Saudi)
  #   - cron: "0 3 * * *"
  workflow_dispatch:
    # Manual run from GitHub Actions tab
    inputs:
      target_date:
        description: "Day to prepare, YYYY-MM-DD. Leave empty for the newest raw file."
        required: false
        default: ""
  repository_dispatch:
    # External cron (e.g. cron-job.org) via GitHub API
    types: [manual-trigger]

concurrency:
  group: skidata-odoo
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Parking Transactions pipeline
        env:
          UPLOAD_TO_SHAREPOINT: "true"
          TARGET_DATE: ${{ inputs.target_date }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
          # Raw daily Parking Transactions source folder
          TARGET_FOLDER_PATH: ${{ secrets.TARGET_FOLDER_PATH }}
          # Transformed *-Odoo.xlsx destination (defaults to "SKIDATA - Odoo" if unset)
          TARGET_FOLDER_PATH_ODOO: ${{ secrets.TARGET_FOLDER_PATH_ODOO }}
        run: python main.py
