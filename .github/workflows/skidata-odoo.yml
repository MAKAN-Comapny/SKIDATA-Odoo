name: SKIDATA-Odoo Parking Pipeline

on:
  schedule:
    # 05:30 UTC = 08:30 AM Saudi Time (AST) - Runs 30 mins after scraper starts at 08:00 AM Saudi
    - cron: "30 5 * * *"
  workflow_dispatch:
    # Manual run from GitHub Actions tab
    inputs:
      mode:
        description: "Mode: '5days_rolling' (test 5-day rolling), 'daily', or 'aug_sep_historical'"
        required: false
        default: "5days_rolling"
      target_date:
        description: "Date filter in filename (YYYY-MM-DD or DD-Mon). Leave empty for latest file."
        required: false
        default: ""
      source_folder:
        description: "Source SharePoint folder (defaults to 'Ski Data 5')"
        required: false
        default: "Ski Data 5"
      target_folder_odoo:
        description: "Destination folder (defaults to 'Odoo_testing_Sumit')"
        required: false
        default: "Odoo_testing_Sumit"
  repository_dispatch:
    # External cron (e.g. cron-job.org) via GitHub API
    types: [manual-trigger]

concurrency:
  group: skidata-odoo
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref || 'feature/5-days-rolling' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Parking Transactions pipeline
        env:
          UPLOAD_TO_SHAREPOINT: "true"
          TARGET_DATE: ${{ inputs.target_date }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
          SHAREPOINT_SOURCE_FOLDER: ${{ inputs.source_folder || 'Ski Data 5' }}
          TARGET_FOLDER_PATH: ${{ inputs.source_folder || 'Ski Data 5' }}
          TARGET_FOLDER_PATH_ODOO: ${{ inputs.target_folder_odoo || 'Odoo_testing_Sumit' }}
        run: |
          if [ "${{ inputs.mode }}" = "aug_sep_historical" ]; then
            if [ -n "${{ inputs.source_folder }}" ] && [ "${{ inputs.source_folder }}" != "Ski Data 5" ]; then
              python process_aug_sep.py --source-folder "${{ inputs.source_folder }}"
            else
              python process_aug_sep.py
            fi
          else
            python main.py
          fi
